<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidad II - Semana 01</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FE; }
        .bg-upla-gradient { background: linear-gradient(135deg, #7F7DFD 0%, #68CFC9 100%); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <div class="flex items-center gap-4 mb-2">
            <span class="text-[#7F7DFD] font-bold tracking-widest text-sm uppercase">Unidad II</span>
        </div>
        
        <div class="flex items-center gap-4 mb-8">
            <div class="bg-upla-gradient w-14 h-14 rounded-full flex items-center justify-center text-white font-bold text-xl shadow-lg">
                01
            </div>
            <div>
                <h1 class="text-2xl font-bold text-[#1F1F3D]">Semana 01 — Inicio de Gestión Avanzada</h1>
                <p class="text-gray-500 italic">Corresponde a la Semana 5 del ciclo académico</p>
            </div>
            <div id="contadorArchivos" class="ml-auto bg-[#E0E0FE] text-[#7F7DFD] px-3 py-1 rounded-full text-xs font-bold">
                0 archivos
            </div>
        </div>

        <div id="contenedorMateriales" class="space-y-4">
            <p class="text-center text-gray-400 py-10 italic">Consultando materiales de la Unidad II...</p>
        </div>

        <div id="areaAdmin" class="hidden mt-10 pt-6 border-t border-dashed border-[#7F7DFD]">
            <button onclick="abrirModalSubida()" class="w-full border-2 border-dashed border-[#7F7DFD] text-[#7F7DFD] py-4 rounded-2xl font-bold hover:bg-[#7F7DFD]/5 transition flex items-center justify-center gap-2">
                <span>↑</span> Subir a Unidad 2 - Semana 1
            </button>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';

        const rol = localStorage.getItem('userRol');
        const contenedor = document.getElementById('contenedorMateriales');
        const areaAdmin = document.getElementById('areaAdmin');

        if (rol === 'admin') areaAdmin.classList.remove('hidden');

        async function cargarDatosUnidad2() {
            // Buscamos unidad 2, semana 5 (que es tu semana 1 de esa unidad)
            const { data, error } = await supabase
                .from('materiales')
                .select('*')
                .eq('unidad', 2)
                .eq('semana', 5); 

            if (error) {
                contenedor.innerHTML = `<p class="text-red-500">Error: ${error.message}</p>`;
                return;
            }

            document.getElementById('contadorArchivos').innerText = `${data.length} archivos`;

            if (data.length === 0) {
                contenedor.innerHTML = `<p class="text-gray-400 text-center py-10">No hay archivos en la Semana 1 de la Unidad II.</p>`;
                return;
            }

            contenedor.innerHTML = "";
            data.forEach(archivo => {
                contenedor.innerHTML += `
                    <div class="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm flex items-center justify-between hover:border-[#7F7DFD] transition">
                        <div class="flex items-center gap-4">
                            <div class="bg-[#F4F4FF] p-3 rounded-xl text-xl">📄</div>
                            <div>
                                <h3 class="font-bold text-[#1F1F3D]">${archivo.titulo}</h3>
                                <p class="text-xs text-gray-400 uppercase font-semibold">Material de Lectura</p>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-3">
                            <a href="${archivo.url_archivo}" target="_blank" class="bg-upla-gradient text-white px-6 py-2 rounded-xl text-sm font-bold shadow-md">
                                Abrir enlace
                            </a>
                            ${rol === 'admin' ? `
                                <button onclick="eliminarRegistro(${archivo.id})" class="text-red-400 hover:text-red-600 p-2">
                                    🗑️
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
        }

        window.eliminarRegistro = async (id) => {
            if(confirm("¿Eliminar este material de la Unidad 2?")) {
                const { error } = await supabase.from('materiales').delete().eq('id', id);
                if(!error) cargarDatosUnidad2();
            }
        };

        cargarDatosUnidad2();
    </script>
</body>
</html>
